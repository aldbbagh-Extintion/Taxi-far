<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#f9c806",
              "background-light": "#f8f8f5",
              "background-dark": "#231f0f",
            },
            fontFamily: {
              display: ["Space Grotesk"],

<p class="text-xl text-background-dark/70 dark:text-background-light/70">30 دقيقة</p>
</div>
</div>
<div class="mt-8">
<p class="text-background-dark/70 dark:text-background-light/70">شكراً لركوبك معنا 🚕</p>
</div>
</div>
</main>
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark">
<div class="p-4">
<button class="h-16 w-full rounded-full bg-primary text-3xl font-bold text-background-dark shadow-lg">عرض التفاصيل</button>
</div>
</footer>
</div>

</html>
