name: Android debug APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: "44:65:E4:F0:B6:21:89:EE:94:38:38:BC:E5:E2:A6:3B:96:FB:EF:06:EE:CB:F6:71:81:28:F5:16:71:D7:0F:E0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Build web app (Angular)
        run: npx ng build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Install fixed signing key
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is missing"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK (Gradle)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK signer
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          GOT=$(echo "$OUT" | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          WANT=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'a-f' 'A-F')
          echo "signer SHA-256: $GOT"
          if [ -z "$GOT" ] || [ "$GOT" != "$WANT" ]; then
            echo "::error::APK signer does not match EXPECTED_CERT_SHA256"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxi-meter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to "latest" release (easy phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk taxi-meter.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest taxi-meter.apk --title "عداد التاكسي — آخر نسخة تجريبية" \
            --notes "نسخة debug مبنية تلقائيًا من آخر commit (${GITHUB_SHA::7}). للتجربة فقط." --target "$GITHUB_SHA"
